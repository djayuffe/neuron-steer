[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-steer"
version = "0.2.0"
description = "Local Transformers neuron steering, paired evaluation and explicit Neuronpedia research tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.5", "setuptools>=68", "wheel"]
runtime = ["torch>=2.2", "transformers>=4.40", "safetensors>=0.4"]

[project.scripts]
neuron-steer = "neuron_steer.cli:main"

[tool.setuptools.packages.find]
include = ["neuron_steer*"]

[tool.setuptools.package-data]
neuron_steer = ["prompts/*.json"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "C4", "UP"]

[project.urls]
Repository = "https://github.com/djayuffe/neuron-steer"
Documentation = "https://github.com/djayuffe/neuron-steer/blob/main/design.md"
