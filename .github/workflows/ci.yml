name: Verify standalone package
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install setuptools wheel ruff==0.17.5
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: ruff check neuron_steer tests
      - run: ruff format --check neuron_steer tests
      - run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - run: neuron-steer generate --model /not-loaded --neuron 0:0:0 --prompt synthetic --dry-run
      - run: neuron-steer neuronpedia link --url https://www.neuronpedia.org/gemma-2-2b/20-gemmascope-res-16k/10956
      - run: neuron-steer generate --model /not-loaded --neuron 0:0:0 --prompt synthetic --reference https://www.neuronpedia.org/gemma-2-2b/20-gemmascope-res-16k/10956 --dry-run
      - run: neuron-steer generate --model /not-loaded --baseline --prompt synthetic --dry-run
      - run: neuron-steer evaluate --model /not-loaded --neuron 0:0:0 --limit 1 --output /tmp/neuron-steer-ci-preview.json --dry-run

  real-transformers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ['4.40.2', '5.23.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "transformers==${{ matrix.transformers }}" safetensors setuptools wheel
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m unittest discover -s tests -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
