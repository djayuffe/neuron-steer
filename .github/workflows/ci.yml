name: Verify standalone package
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install setuptools wheel ruff==0.17.5
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: ruff check neuron_steer tests
      - run: ruff format --check neuron_steer tests
      - run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - run: neuron-steer generate --model /not-loaded --neuron 0:0:0 --prompt synthetic --dry-run
      - run: neuron-steer neuronpedia link --url https://www.neuronpedia.org/gemma-2-2b/20-gemmascope-res-16k/10956
      - run: neuron-steer generate --model /not-loaded --neuron 0:0:0 --prompt synthetic --reference https://www.neuronpedia.org/gemma-2-2b/20-gemmascope-res-16k/10956 --dry-run
